<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>%VITE_APP_TITLE%</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- English fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Arabic fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Preload critical local fonts (fallback if using self-hosted /public/fonts) -->
    <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Cairo-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Cairo-700.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Theme initialization script - runs before React to prevent flash -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('theme') || 'system';
          const isDark = storedTheme === 'dark' || (storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const html = document.documentElement;
          html.setAttribute('data-theme', isDark ? 'dark' : 'light');
          html.style.colorScheme = isDark ? 'dark' : 'light';
          if (isDark) html.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>

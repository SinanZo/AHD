name: Build and Deploy Client (CI)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@10.4.1

      - name: Install dependencies (pnpm workspace)
        run: pnpm -w install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: pnpm run build

      - name: Prepare prebuilt output for Vercel
        run: |
          # Create the prebuilt output directory expected by Vercel
          mkdir -p .vercel/output/public
          # Copy built static files into the prebuilt public directory
          cp -a client/dist/. .vercel/output/public/
          # Create config.json with SPA routing (all routes serve index.html)
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              {
                "handle": "filesystem"
              },
              {
                "src": "/(.*)",
                "dest": "/index.html"
              }
            ]
          }
          EOF

      - name: Deploy prebuilt to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          echo "Deploying prebuilt output to Vercel project $VERCEL_PROJECT_ID (org $VERCEL_ORG_ID)"
          npx -y vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes

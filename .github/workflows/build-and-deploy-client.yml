name: Build and Deploy Client (CI)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack and prepare pnpm@10.4.1
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies (pnpm workspace)
        run: pnpm -w install --frozen-lockfile

      - name: Build client
        run: pnpm -C client build

      - name: Deploy built client to Vercel
        if: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying to Vercel project $VERCEL_PROJECT_ID (org $VERCEL_ORG_ID)"
          # Deploy the static output directory produced by the client build
          npx -y vercel@latest client/dist --prod --token "$VERCEL_TOKEN" --confirm
